<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApnaCart - Modern E-Commerce Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600"><i class="fa-solid fa-cart-shopping mr-2"></i>ApnaCart</h1>
            
            <div class="hidden md:flex flex-1 max-w-md mx-8">
                <input type="text" id="searchInput" placeholder="Products search karein..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button onclick="toggleCart()" class="relative bg-indigo-600 text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-indigo-700 transition">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Cart</span>
                <span id="cartCount" class="bg-red-500 text-xs px-2 py-0.5 rounded-full">0</span>
            </button>
        </div>
        <!-- Mobile Search Bar -->
        <div class="px-4 pb-4 md:hidden">
            <input type="text" id="mobileSearchInput" placeholder="Products search karein..." class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Categories -->
        <div class="flex gap-2 overflow-x-auto pb-4 mb-6">
            <button onclick="filterCategory('All')" class="category-btn bg-indigo-600 text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Sabhi</button>
            <button onclick="filterCategory('Lighting')" class="category-btn bg-white text-gray-700 border px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Lighting</button>
            <button onclick="filterCategory('Decor')" class="category-btn bg-white text-gray-700 border px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Home Decor</button>
            <button onclick="filterCategory('Electronics')" class="category-btn bg-white text-gray-700 border px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">Electronics</button>
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic Products will be injected here -->
        </div>
    </main>

    <!-- Slide-over Cart Drawer -->
    <div id="cartDrawer" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full flex flex-col p-6 shadow-xl">
            <div class="flex justify-between items-center border-b pb-4">
                apne Cart <h2 class="text-xl font-bold">Aapka Cart</h2>
                <button onclick="toggleCart()" class="text-gray-500 hover:text-black"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div id="cartItems" class="flex-1 overflow-y-auto py-4 space-y-4">
                <!-- Cart items will load here -->
            </div>

            <div class="border-t pt-4">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>Total:</span>
                    <span id="cartTotal">₹0</span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">Checkout Karein</button>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Antique Brass Light", price: 2499, category: "Lighting", image: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=400" },
            { id: 2, name: "Modern Pendant Light", price: 1899, category: "Lighting", image: "https://images.unsplash.com/photo-1540932239986-30128078f3c5?w=400" },
            { id: 3, name: "Brass Table Lamp", price: 3199, category: "Lighting", image: "https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?w=400" },
            { id: 4, name: "Decorative Wall Clock", price: 999, category: "Decor", image: "https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?w=400" },
            { id: 5, name: "Smart LED Bulb", price: 499, category: "Electronics", image: "https://images.unsplash.com/photo-1550985616-11610c812127?w=400" },
        ];

        let cart = [];

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = items.map(p => `
                <div class="bg-white border rounded-xl overflow-hidden shadow-sm hover:shadow-md transition">
                    <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <span class="text-xs text-indigo-600 font-semibold uppercase">${p.category}</span>
                        <h3 class="font-bold text-lg text-gray-800 mt-1">${p.name}</h3>
                        <p class="text-gray-600 font-medium mt-2">₹${p.price}</p>
                        <button onclick="addToCart(${p.id})" class="w-full mt-4 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);
            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.innerText = totalCount;

            if (cart.length === 0) {
                cartItems.innerHTML = `<p class="text-gray-500 text-center py-8">Aapka cart khali hai.</p>`;
                cartTotal.innerText = '₹0';
                return;
            }

            let total = 0;
            cartItems.innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                return `
                    <div class="flex justify-between items-center border-b pb-3">
                        <div>
                            <h4 class="font-semibold text-sm">${item.name}</h4>
                            <p class="text-xs text-gray-500">₹${item.price} x ${item.quantity}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQuantity(${item.id}, -1)" class="bg-gray-200 px-2 py-1 rounded text-sm">-</button>
                            <span class="text-sm font-bold">${item.quantity}</span>
                            <button onclick="updateQuantity(${item.id}, 1)" class="bg-gray-200 px-2 py-1 rounded text-sm">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            cartTotal.innerText = `₹${total}`;
        }

        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            drawer.classList.toggle('hidden');
        }

        function filterCategory(category) {
            if (category === 'All') {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.category === category));
            }
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Pehle cart mein kuch add karein!');
                return;
            }
            alert('Order Successfully Placed! Thank you for shopping with ApnaCart.');
            cart = [];
            updateCartUI();
            toggleCart();
        }

        // Search Handlers
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderProducts(products.filter(p => p.name.toLowerCase().includes(term)));
        });
        document.getElementById('mobileSearchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            renderProducts(products.filter(p => p.name.toLowerCase().includes(term)));
        });

        // Initial render
        renderProducts(products);
    </script>
</body>
</html>
